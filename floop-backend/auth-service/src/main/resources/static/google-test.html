<!DOCTYPE html>
<html>
<head>
    <title>Google OAuth2 Test</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<h2>Google ile giris</h2>

<div id="g_id_onload"
     data-client_id="481177776448-s0l9g1t365k4jk236ag2psq8flhbvdef.apps.googleusercontent.com"
     data-callback="handleCredentialResponse">
</div>
<div class="g_id_signin" data-type="standard"></div>

<p id="token"></p>

<script>
    function handleCredentialResponse(response) {
        document.getElementById('token').innerText = response.credential;
        console.log('idToken:', response.credential);
    }
</script>
</body>
</html>
